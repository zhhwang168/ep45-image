shapes, charming handcrafted paper diorama, off-white paper backdrop, soft directional studio light accentuating depth, full body visible centered, square composition. No text, props, extra characters, watermark, or 3D plastic surfaces.\n", "description": "色、目、胸のマークを保ちながら素材を変更しています。", "transparent": false}, {"id": "26", "label": "粘土のロボット", "file": "26-Robot-Clay.png", "group": "スタイル変換", "width": 1254, "height": 1254, "bytes": 2029682, "type": "PNG", "category": "style", "poster": "26-Robot-Clay.png", "prompt": "Use case: stylized-concept. Transform exact robot from attached reference into an adorable handmade clay stop-motion model. Preserve same round large head, orange crown/side earpieces, navy face panel with cyan blue oval eyes and smile, orange-white body, chest orange lightning, orange hands and toes. Entire character sculpted from colored modeling clay with subtle fingerprints, small tool marks, gently uneven handmade edges, tactile matte clay. Same neutral front-facing full-body stance, centered, feet visible, warm off-white studio backdrop and soft grounding shadow. Beautiful soft studio photograph of a real clay model, square composition, no extra props, no text, no watermark.\n", "description": "色、目、胸のマークを保ちながら素材を変更しています。", "transparent": false}, {"id": "27", "label": "英語版サムネイル", "file": "27-Video-Thumbnail-English.png", "group": "サムネイル", "width": 1672, "height": 941, "bytes": 1692674, "type": "PNG", "category": "design", "poster": "27-Video-Thumbnail-English.png", "prompt": "Use case: ads-marketing. Create a polished high-impact YouTube thumbnail in widescreen 16:9. Use the attached cute robot as exact identity reference: orange-white shell, round head, navy face cyan eyes, orange lightning chest. Place robot on RIGHT 42% of image, upper body large with one hand waving, cheerful expression, full head comfortably inside frame. LEFT 55% has huge crisp bold clean sans-serif typography, exact words only: 'New Ways' on line 1, 'to Create' on line 2, 'with AI g down at pages with happy attentive cyan eyes. Preserve exact identity: round white head orange crown and earpieces, navy face, blue oval eyes, orange-white body and chest lightning visible above book, same proportions and limb design. Soft morning window light, pale oak bookshelf and small plant behind, uncluttered warm room, original friendly design. Book pages have no legible text. Full character comfortably framed, no extra characters, no captions or logos. High quality tactile matte surfaces, coherent hands and book.\n", "description": "同じ基準画像を使い、読書、料理、キャンプの場面を作っています。", "transparent": false}, {"id": "30", "label": "料理するロボット", "file": "30-Robot-Cooking.png", "group": "キャラクターシリーズ", "width": 1672, "height": 941, "bytes": 1911840, "type": "PNG", "category": "character", "poster": "30-Robot-Cooking.png", "prompt": "Use case: illustration-story. Wide 16:9 polished 3D animated-film still. Exact orange-white robot character from reference cooking in a warm modern home kitchen. Preserve original round white head orange crown and side pads, navy face with cyan eyes and friendly smile, orange lightning chest clearly visible, identical shell, gloves and proportions. Robot stands beside a low kitchen counter, full body and feet visible; right hand holding a wooden spoon stirring a small pot, left hand resting safely beside a bowl of colorful vegetables. No clothing covering chest, no chef hat. Soft daylight, cream cabinets and light oak counter, uncluttered props, gentle steam above pot, natural contact shadows, no extra arms or fingers, believable spoon grip. Cheerful cozy mood, no other characters, no text or logos.\n", "description": "同じ基準画像を使い、読書、料理、キャンプの場面を作っています。", "transparent": false}, {"id": "31", "label": "キャンプするロボット", "file": "31-Robot-Camping.png", "group": "キャラクターシリーズ", "width": 1672, "height": 941, "bytes": 2248836, "type": "PNG", "category": "character", "poster": "31-Robot-Camping.png", "prompt": "Use case: illustration-story. Widescreen 16:9 polished 3D an n cozy room holding a little smartphone at arm's length, smiling for selfie, orange cat approaches from floor. TOP RIGHT: robot still holding phone while cat climbs onto its shoulder, robot looks surprised. BOTTOM LEFT: cat's face is very close to smartphone lens, huge cute nose, robot behind looking confused. BOTTOM RIGHT: robot and cat happily pose side by side for a selfie, robot arm with phone visible. Clear coherent actions, SAME phone and room palette, charming expressive 3D-cartoon illustration, warm soft light. Each panel readable and distinct, no extra limbs, no logos or symbols.\n", "description": "ロボットの自撮りに猫が割り込む、セリフなしの4コマ漫画です。各コマは34-Comic-Panelsにあります。", "transparent": false}, {"id": "35", "label": "コーヒーカップの中の温泉", "file": "35-Miniature-Coffee-Hot-Spring.png", "group": "空想の場面", "width": 1672, "height": 941, "bytes": 2377839, "type": "PNG", "category": "fun", "poster": "35-Miniature-Coffee-Hot-Spring.png", "prompt": "Use case: stylized-concept. Create a whimsical photorealistic miniature world, widescreen 16:9 macro product-style photograph. A large orange ceramic coffee cup on a wooden cafe table contains a tiny steaming Japanese-style hot spring instead of coffee: clear warm blue-green water, miniature smooth stones along inner rim, a tiny wooden bathing platform, miniature towels, three tiny adult bathers relaxing with only heads and shoulders visible above water. A tiny wooden ladder leans against outside of cup, one tiny fully dressed traveler rests at the cup rim. Scale contrast unmistakable, whole cup and handle visible, gentle steam, warm window light, shallow depth of field with beautiful bokeh. Charming plausible miniature diorama, richly tactile ceramics, no words or signs, no logos, no oversized people, no nudity visible.\n", "description": "身近な物にありえない世界を組み合わせた作例です。", "transparent": false}, {"id": "36", "label": "パンの上の街", "file": "36-Miniature-Bread-City.png", "group": "空想の場面", "width": 1672, "height": 941, "bytes": 3097562, "type": "PNG", "cate scent moon surrounded by delicate pearlescent silver-blue liquid and a graceful swirl of fine starlight. Very small discreet silver crescent emblem near lower edge only, no broad paper label obscuring the contents. Sensual flowing contours, jewel-like optical glass highlights, believable craft and balance. Make it feel like a beautiful limited-edition beverage or magical keepsake, not a generic water bottle, perfume bottle, chemistry flask, or snow globe. Clear elegant silhouette fully visible with generous margins; bottle is the hero centered slightly right of center, strong subtle reflected caustics on stone, one coherent neck and cap, no handle. Keep dark surroundings understated so rim light reveals the redesigned glass shape. Widescreen 16:9 composition. No lettering, no logos, no words, no watermark, no extra bottles.\n", "description": "丸いガラス瓶と銀色の三日月キャップに、月と星の光を閉じ込めた新版です。", "transparent": false}]</script>
<script>
'use strict';
const assets=JSON.parse(document.getElementById('asset-data').textContent);
const byId=new Map(assets.map(a=>[a.id,a]));
const categories=[['all','すべて'],['animation','GIF アニメーション'],['edit','画像編集'],['background','背景の変更'],['style','スタイル変換'],['character','キャラクターと場面'],['design','デザイン素材'],['fun','楽しい作例']];
const $=id=>document.getElementById(id);let category='all',query='',shown=[],currentId=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const url=file=>'Images/'+file.split('/').map(encodeURIComponent).join('/');
const h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function src(a){return url(a.type==='GIF'&&!playing?a.poster:a.file)}
function renderFilters(){ $('filters').innerHTML=categories.map(([id,label])=>`<button class="filter" data-category="${id}" aria-pressed="${id===category}">${label}<span>${id==='all'?assets.length:assets.filter(a=>a.category===id).length}</span></button>`).join(''); }
function render(){
 shown=assets.filter(a=>(category==='all'||a.category===category)&&(!query||[a.id,a.label,a.file,a.group,a.type,a.description].join(' ').toLowerCase().includes(query)));
 $('result-count').textContent=`表示 ${shown.length} / ${assets.length}  件の作例`;
 $('clear-search').hidden=!$('search').value;
 $('grid').innerHTML=shown.length?shown.map(a=>`<article class="card"><button class="image-button ${a.transparent?'checker':''}" data-open="${a.id}" aria-label="拡大 ${a.id} ${h(a.label)}"><img src="${src(a)}" alt="${h(a.label)}" loading="lazy" decoding="async"><span class="badge">${a.id}</span><span class="badge kind">${a.type}${a.loop_duration_ms?' · '+(a.loop_duration_ms/1000).toFixed(1)+'s':''}</span></button><div class="card-bottom"><div><h3>${h(a.label)}</h3><p class="card-meta">${h(a.group)} · ${a.width} × ${a.height}</p></div><span class="expand" aria-hidden="true">↗</span></div></article>`).join(''):`<div class="empty"><h2>一致する作例がありません</h2><p>名前や番号を変えるか、すべての作例を表示してください。</p><button class="quiet-btn" id="reset-filter">すべての作例を表示</button></div>`;
 renderFilters();syncAnimationButtons();
}
function syncAnimationButtons(){ $('animation-toggle').textContent=playing?'GIF を一時停止':'GIF を再生';$('animation-toggle').setAttribute('aria-pressed',String(playing));$('modal-animation').textContent=playing?'GIF を一時停止':'GIF を再生';}
function setAnimation(){playing=!playing;render();if(currentId)updateViewer(currentId);}
function openViewer(id){currentId=id;updateViewer(id);if(!$('viewer').open)$('viewer').showModal();}
function updateViewer(id){
 const a=byId.get(id);if(!a)return;currentId=id;
 $('modal-title').textContent=a.id+' · '+a.label;
 $('modal-sub').textContent=`${a.type} · ${a.width} × ${a.height} · ${a.file}`;
 $('modal-image').alt=a.label;$('modal-image').src=src(a);
 $('open-original').href=url(a.file);$('download-original').href=url(a.file);$('download-original').download=a.file;
 $('modal-note').textContent=a.description;
 $('prompt-details').hidden=!a.prompt;$('prompt-details').open=false;$('prompt-text').textContent=a.prompt||'';$('copy-status').textContent='';
 $('modal-animation').hidden=a.type!=='GIF';$('bg-group').hidden=!a.transparent;
 $('modal-stage').classList.remove('checker');$('modal-stage').dataset.bg=a.transparent?'white':'';
 document.querySelectorAll('.bg-choice').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color==='white')));
 const list=shown.length?shown:assets,pos=list.findIndex(x=>x.id===id);$('prev-item').disabled=list.length<2||pos<0;$('next-item').disabled=list.length<2||pos<0;
 syncAnimationButtons();
}
function navigate(delta){const list=shown.length?shown:assets;const i=list.findIndex(a=>a.id===currentId);if(i<0)return;updateViewer(list[(i+delta+list.length)%list.length].id);}
function switchTab(name){const gallery=name==='gallery';$('gallery-tab').setAttribute('aria-selected',String(gallery));$('compare-tab').setAttribute('aria-selected',String(!gallery));$('gallery-panel').hidden=!gallery;$('compare-panel').hidden=gallery;}
const comparisons=[
 {title:'花瓶の色を変更',before:'10',after:['12','11'],labels:['濃い青の花瓶','赤い丸のマークを表示'],note:'10 元画像 → 11 マーク → 12 色変更'},
 {title:'会話で段階的に編集',before:'15',after:['16','17','18'],labels:['手順 1：右に移動','手順 2：夕方の光','手順 3：白いマグカップ'],note:'同じ場面を一つずつ変更'},
 {title:'商品写真の背景を変更',before:'19',after:['20','21a','21b','21c','21d'],labels:['窓辺の朝の光','白いスタジオ','カフェ','自宅の書斎','屋外の庭'],note:'玩具の特徴を保ちながら背景を比較'},
 {title:'不要な物を削除',before:'22',after:['23'],labels:['段ボール箱を削除した後'],note:'左の箱を消し、ほかの物を残す'},
 {title:'同じキャラクターを異なる素材で',before:'01',after:['24','25','26'],labels:['水彩','ペーパークラフト','粘土'],note:'キャラクターの特徴を保って素材を変更'},
 {title:'SVG アイコンの色変更',before:'13',after:['14'],labels:['青緑色のバージョン'],note:'どちらも編集可能なベクターファイルです'}
];
function renderComparisons(){
 $('comparisons').innerHTML=comparisons.map((c,i)=>{const a=byId.get(c.before),b=byId.get(c.after[0]);return `<article class="compare-card"><div class="compare-top"><h2>${c.title}</h2><select aria-label="${c.title}：編集結果を選択" data-compare-select="${i}">${c.after.map((id,j)=>`<option value="${id}">${c.labels[j]}</option>`).join('')}</select></div><div class="comparison" id="comparison-${i}"><img src="${url(a.file)}" alt="${h(a.label)}：変更前" loading="lazy"><img class="after" src="${url(b.file)}" alt="${h(b.label)}：変更後" loading="lazy"><span class="split-line"></span><span class="compare-label">元画像</span><span class="compare-label right">変更後</span><input type="range" min="0" max="100" value="50" aria-label="${c.title}：ドラッグして変更前後を比較" data-split="${i}"></div><div class="compare-foot">${c.note}<a href="${url(b.file)}" target="_blank" rel="noopener" data-compare-link="${i}">結果を開く ↗</a></div></article>`}).join('');
}
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;render();}});
$('search').addEventListener('input',()=>{query=$('search').value.trim().toLowerCase();render();});
$('clear-search').addEventListener('click',()=>{$('search').value='';query='';render();$('search').focus();});
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openViewer(b.dataset.open);if(e.target.id==='reset-filter'){query='';category='all';$('search').value='';render();}});
$('grid').addEventListener('error',e=>{if(e.target.tagName==='IMG'){e.target.classList.add('broken');const box=e.target.parentNode;if(!box.querySelector('.load-error')){const msg=document.createElement('span');msg.className='load-error';msg.textContent='画像が見つかりません。このページを Images フォルダーと同じ場所に置いてください。';box.append(msg);}}},true);
$('animation-toggle').addEventListener('click',setAnimation);$('modal-animation').addEventListener('click',setAnimation);
$('density-toggle').addEventListener('click',()=>{const enabled=document.body.classList.toggle('compact');$('density-toggle').setAttribute('aria-pressed',String(enabled));$('density-toggle').textContent=enabled?'ゆったり表示':'コンパクト表示';});
$('gallery-tab').addEventListener('click',()=>switchTab('gallery'));$('compare-tab').addEventListener('click',()=>switchTab('compare'));
$('close-viewer').addEventListener('click',()=>$('viewer').close());$('viewer').addEventListener('close',()=>{currentId=null;});
$('viewer').addEventListener('click',e=>{if(e.target===$('viewer')){const r=$('viewer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('viewer').close();}});
$('prev-item').addEventListener('click',()=>navigate(-1));$('next-item').addEventListener('click',()=>navigate(1));
document.addEventListener('keydown',e=>{if($('viewer').open&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowLeft'){e.preventDefault();navigate(-1)}if(e.key==='ArrowRight'){e.preventDefault();navigate(1)}}if(!$('viewer').open&&e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();switchTab('gallery');$('search').focus();}});
document.querySelectorAll('.bg-choice').forEach(b=>b.addEventListener('click',()=>{const color=b.dataset.color;$('modal-stage').dataset.bg=color;$('modal-stage').classList.toggle('checker',color==='checker');document.querySelectorAll('.bg-choice').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
$('comparisons').addEventListener('input',e=>{if(e.target.dataset.split!==undefined)$('comparison-'+e.target.dataset.split).style.setProperty('--split',e.target.value+'%');});
$('comparisons').addEventListener('change',e=>{if(e.target.dataset.compareSelect!==undefined){const i=e.target.dataset.compareSelect,a=byId.get(e.target.value),img=$('comparison-'+i).querySelector('.after');img.src=url(a.file);img.alt=a.label+'：変更後';document.querySelector(`[data-compare-link="${i}"]`).href=url(a.file);}});
$('copy-prompt').addEventListener('click',async()=>{const text=$('prompt-text').textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';$('viewer').append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy');}$('copy-status').textContent='コピーしました';}catch{$('copy-status').textContent='上のテキストを選択してコピーしてください';}});
render();renderComparisons();
</script>
</body>
</html>
